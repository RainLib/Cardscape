<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title description">
  <title id="title">Cardscape</title>
  <desc id="description">Two tilted cards with a diagonal foil reflection</desc>
  <defs>
    <linearGradient id="plate" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#1c2541"/>
      <stop offset="1" stop-color="#0c1021"/>
    </linearGradient>
    <linearGradient id="face" x1="0" x2="1" y1="1" y2="0">
      <stop stop-color="#292454"/>
      <stop offset=".48" stop-color="#131d39"/>
      <stop offset="1" stop-color="#253b53"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#76e8e3"/>
      <stop offset=".48" stop-color="#afc5ff"/>
      <stop offset="1" stop-color="#b294f7"/>
    </linearGradient>
    <linearGradient id="foil" x1="16" x2="102" y1="89" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a996fc" stop-opacity=".15"/>
      <stop offset=".42" stop-color="#bb8df8" stop-opacity=".93"/>
      <stop offset=".72" stop-color="#8ee8ee" stop-opacity=".95"/>
      <stop offset="1" stop-color="#8ef4d3" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="card">
      <path d="M45 22 96 30q4 1 3 5l-10 63q-1 4-5 3l-51-8q-4-1-3-5l10-63q1-4 5-3Z"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="118" height="118" rx="27" fill="url(#plate)" stroke="#34415f" stroke-width="2"/>
  <path d="m21 39 40-20q5-2 7 3l24 52q2 5-3 7L49 102q-5 2-7-3L18 46q-2-5 3-7Z" fill="#202e49" stroke="#6585a4" stroke-width="2.6"/>
  <g clip-path="url(#card)">
    <path fill="url(#face)" d="M20 14h85v94H20z"/>
    <path d="M24 81 92 21l12 7-75 68Z" fill="url(#foil)"/>
    <path d="m30 98 70-65 7 10-76 65Z" fill="#7e63e2" opacity=".24"/>
    <path d="M31 91 98 29" stroke="#e5ffff" stroke-width="1.7" opacity=".82"/>
  </g>
  <path d="M45 22 96 30q4 1 3 5l-10 63q-1 4-5 3l-51-8q-4-1-3-5l10-63q1-4 5-3Z" fill="none" stroke="url(#rim)" stroke-width="2.9"/>
  <path d="M76 47q1.3 7.7 9 9-7.7 1.3-9 9-1.3-7.7-9-9 7.7-1.3 9-9Z" fill="#e1fff8"/>
</svg>
