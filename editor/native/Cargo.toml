[package]
name = "card-worker"
version = "0.6.4"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
